app {
  name = "kafka-streaming-pipeline"
}

kafka {
  bootstrap-servers = "localhost:9092"
  bootstrap-servers = ${?KAFKA_BOOTSTRAP_SERVERS}

  security-protocol = ${?KAFKA_SECURITY_PROTOCOL}
  sasl-mechanism = ${?KAFKA_SASL_MECHANISM}
  sasl-jaas-config = ${?KAFKA_SASL_JAAS_CONFIG}

  producer {
    topic = "pipeline-output"
    topic = ${?KAFKA_PRODUCER_TOPIC}

    key-serializer = "org.apache.kafka.common.serialization.StringSerializer"
    value-serializer = "org.apache.kafka.common.serialization.StringSerializer"

    acks = "all"
    acks = ${?KAFKA_PRODUCER_ACKS}

    retries = 3
    retries = ${?KAFKA_PRODUCER_RETRIES}

    linger-ms = 20
    linger-ms = ${?KAFKA_PRODUCER_LINGER_MS}

    batch-size = 32768
    batch-size = ${?KAFKA_PRODUCER_BATCH_SIZE}

    enable-idempotence = true
    enable-idempotence = ${?KAFKA_PRODUCER_ENABLE_IDEMPOTENCE}

    max-in-flight-requests = 5
    max-in-flight-requests = ${?KAFKA_PRODUCER_MAX_IN_FLIGHT_REQUESTS}

    request-timeout-ms = 30000
    request-timeout-ms = ${?KAFKA_PRODUCER_REQUEST_TIMEOUT_MS}

    delivery-timeout-ms = 120000
    delivery-timeout-ms = ${?KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS}
  }

  consumer {
    topic = "pipeline-output"
    topic = ${?KAFKA_CONSUMER_TOPIC}

    group-id = "pipeline-consumer-group"
    group-id = ${?KAFKA_CONSUMER_GROUP_ID}

    key-deserializer = "org.apache.kafka.common.serialization.StringDeserializer"
    value-deserializer = "org.apache.kafka.common.serialization.StringDeserializer"

    auto-offset-reset = "earliest"
    auto-offset-reset = ${?KAFKA_CONSUMER_AUTO_OFFSET_RESET}

    enable-auto-commit = true
    enable-auto-commit = ${?KAFKA_CONSUMER_ENABLE_AUTO_COMMIT}

    auto-commit-interval-ms = 5000
    auto-commit-interval-ms = ${?KAFKA_CONSUMER_AUTO_COMMIT_INTERVAL_MS}

    poll-timeout-ms = 1000
    poll-timeout-ms = ${?KAFKA_CONSUMER_POLL_TIMEOUT_MS}

    session-timeout-ms = 45000
    session-timeout-ms = ${?KAFKA_CONSUMER_SESSION_TIMEOUT_MS}

    max-poll-records = 500
    max-poll-records = ${?KAFKA_CONSUMER_MAX_POLL_RECORDS}

    partition-assignment-strategy = "org.apache.kafka.clients.consumer.CooperativeStickyAssignor"
    partition-assignment-strategy = ${?KAFKA_CONSUMER_PARTITION_ASSIGNMENT_STRATEGY}
  }
}
